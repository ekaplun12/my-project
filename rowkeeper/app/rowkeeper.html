<title>Rowkeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#EEF1EA; --surface:#FFFFFF; --sunken:#E3E8DD; --track:#D9DFD2;
  --ink:#241E2B; --muted:#5F5968; --line:#D6DBCF;
  --plum:#7B3D6F; --plum-ink:#FFFFFF; --plum-soft:#F2E5EF;
  --marker:#D98B1E; --marker-soft:#FBEFD9; --marker-ink:#4A2E00;
  --done:#8A9280; --strike:#7B3D6F; --danger:#A8261D; --danger-soft:#FBE7E4;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#17151B; --surface:#221F28; --sunken:#1C1A21; --track:#3A3542;
    --ink:#EFE9F3; --muted:#AAA2B3; --line:#353039;
    --plum:#D9A0CB; --plum-ink:#2A1026; --plum-soft:#3A2536;
    --marker:#F0B04E; --marker-soft:#3A2E1A; --marker-ink:#2A1A00;
    --done:#7F7888; --strike:#D9A0CB; --danger:#FF9A8F; --danger-soft:#3D2220;
  }
}
:root[data-theme="dark"]{
  --ground:#17151B; --surface:#221F28; --sunken:#1C1A21; --track:#3A3542;
  --ink:#EFE9F3; --muted:#AAA2B3; --line:#353039;
  --plum:#D9A0CB; --plum-ink:#2A1026; --plum-soft:#3A2536;
  --marker:#F0B04E; --marker-soft:#3A2E1A; --marker-ink:#2A1A00;
  --done:#7F7888; --strike:#D9A0CB; --danger:#FF9A8F; --danger-soft:#3D2220;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:10;margin-inline:-16px;padding-inline:16px;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.priv{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.grow{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding-inline:18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-decoration:none}
.btn.primary{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--plum-soft);border-color:var(--plum)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);font-weight:700;min-height:44px}
.back svg{width:18px;height:18px}

main{padding-block:24px}
.quiet{color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;background:var(--marker-soft);color:var(--ink);font-size:15px;margin-block:0 16px}

/* library */
.intro{display:grid;gap:10px;padding-block:8px 24px}
.intro h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.intro p{color:var(--muted);max-width:56ch;font-size:17px}
.lib{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lib li+li{border-top:1px solid var(--line)}
.card{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:baseline;text-align:left;background:none;border:0;padding:16px 18px}
.card:hover{background:var(--sunken)}
.card-title{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2}
.card-meta{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.card-prog{color:var(--muted);font-size:14px;white-space:nowrap}
.card-prog .num{color:var(--ink);font-size:15px}
.card .bar{grid-column:1/-1;margin-top:6px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--marker-ink);background:var(--marker);border-radius:4px;padding:1px 6px;vertical-align:2px;margin-left:6px}
.empty{display:grid;gap:12px}
.foot{margin-top:28px;color:var(--muted);font-size:14px;max-width:60ch;display:flex;gap:10px;align-items:flex-start}
.foot svg{flex:none;width:18px;height:18px;margin-top:2px}

.bar{display:flex;gap:2px;height:8px}
.seg{flex:1;background:var(--track);border-radius:2px;transition:background-color .2s}
.seg.on{background:var(--plum)}
.bar.fill{background:var(--track);border-radius:4px;overflow:hidden;display:block}
.bar.fill i{display:block;height:100%;background:var(--plum);transition:width .3s}

/* add */
.addhead{display:grid;gap:6px;margin-block:4px 20px}
.addhead h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.addhead p{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:18px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunken);border-radius:12px;padding:4px}
.seg3 button{border:0;background:none;border-radius:9px;min-height:44px;font-weight:700;font-size:14px;color:var(--muted);padding-inline:6px;line-height:1.2}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:700;font-size:15px}
.hint{color:var(--muted);font-size:14px}
.field input[type=text],.field input[type=url],.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--ground);border-radius:10px;padding:10px 12px;min-height:44px}
.field textarea{min-height:140px;resize:vertical;line-height:1.45}
.drop{position:relative;display:grid;place-items:center;text-align:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:26px 16px;background:var(--ground)}
.drop.over{border-color:var(--plum);background:var(--plum-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop strong{font-size:17px}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:10px;background:var(--ground);border-radius:8px;padding:6px 6px 6px 12px;font-size:14px}
.files .fname{flex:1;min-width:0;overflow-wrap:anywhere}
.files button{border:0;background:none;color:var(--muted);min-height:36px;padding-inline:10px;font-weight:700}
.files .ord{flex:none;width:2.2ch;text-align:right;color:var(--muted);font-size:13px}
.files canvas{flex:none;width:40px;height:40px;object-fit:cover;border-radius:6px;background:var(--track)}
.files .icon{width:36px;padding:0;display:grid;place-items:center;border-radius:8px}
.files .icon:hover{background:var(--sunken)}
.files .icon svg{width:16px;height:16px}
.files .icon[disabled]{opacity:.3;cursor:default}
.group{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.subhead{font-family:var(--f-display);font-weight:600;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.how{font-size:14px;color:var(--muted);background:var(--ground);border-radius:10px;padding:10px 12px}
.how b{color:var(--ink)}
.go{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.job{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.job p{flex:1}
.job.busy{background:var(--plum-soft)}
.job.err{background:var(--danger-soft);color:var(--ink)}
.job.err p::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:8px;vertical-align:1px}
.spinner{flex:none;width:22px;height:22px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--plum);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* pattern */
.phead{display:grid;gap:8px;margin-block:4px 18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.phead h1{font-size:clamp(28px,5.5vw,40px);font-weight:800;letter-spacing:-.02em}
.by{color:var(--muted);font-size:16px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;margin-bottom:12px}
.progline{font-size:16px}
.progline .num{font-size:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tools .btn{min-height:40px;padding-inline:14px;font-size:14px}
.terms{font-size:14px;color:var(--ink);background:var(--plum-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px}
.facts div{background:var(--surface);padding:10px 12px}
.facts dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;font-size:15px}
details.more-info{border-top:1px solid var(--line)}
details.more-info:last-of-type{border-bottom:1px solid var(--line)}
details.more-info summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:8px;font-weight:700;list-style:none}
details.more-info summary::-webkit-details-marker{display:none}
details.more-info summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.more-info[open] summary::before{transform:rotate(45deg)}
details.more-info summary .c{color:var(--muted);font-weight:400}
.dbody{padding-block:0 16px;display:grid;gap:8px}
.dbody ul{margin:0;padding-left:20px}
.abbr{width:100%;border-collapse:collapse;font-size:15px}
.abbr td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.abbr td:first-child{font-family:var(--f-mono);font-weight:500;width:9ch;padding-right:12px;white-space:nowrap}
.origs{display:flex;flex-wrap:wrap;gap:8px}
.origs img{height:120px;width:auto;border-radius:8px;border:1px solid var(--line)}
.origs video{max-width:100%;max-height:420px;border-radius:8px;background:#000}
.origs a{color:var(--plum);font-weight:700}
.infos{margin-bottom:26px}

.infogrid{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:18px;align-items:start}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.icard-h{display:flex;align-items:center;gap:8px}
.icard-h h2{font-size:20px;font-weight:600;flex:1}
.linkbtn{background:none;border:0;color:var(--plum);font-weight:700;min-height:36px;padding-inline:8px;border-radius:8px}
.linkbtn:hover{background:var(--plum-soft)}
.icard .facts{margin:0;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.mats{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.credit-name{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.credit-name small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.credit-lines{display:grid;gap:4px;font-size:15px;overflow-wrap:anywhere}
.credit-lines a{color:var(--plum);font-weight:700}
.fine{font-size:13px;color:var(--muted)}
.missing{font-size:15px;color:var(--muted)}
.infoedit{display:grid;gap:10px}
.infoedit .two{gap:10px}
@media (max-width:700px){.infogrid{grid-template-columns:1fr}}
.sec{margin-bottom:28px}
.sechead{display:flex;align-items:baseline;gap:12px;padding-bottom:8px}
.sechead h2{font-size:24px;font-weight:600;flex:1}
.secprog{color:var(--muted);font-size:14px}
.secnote{color:var(--muted);font-size:15px;margin-bottom:10px;max-width:62ch}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row{display:grid;grid-template-columns:52px 1fr auto 40px;align-items:start;column-gap:6px;padding:10px 4px 10px 0;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row.current{background:var(--marker-soft);box-shadow:inset 4px 0 0 var(--marker)}
.row:first-child.current{border-radius:13px 13px 0 0}
.row:last-child.current{border-radius:0 0 13px 13px}
.row:only-child.current{border-radius:13px}
.tick{width:52px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0}
.ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.row.done .ring{background:var(--plum);border-color:var(--plum)}
.row.done .ring::after{content:"";width:6px;height:11px;border:solid var(--plum-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.row.current .ring{border:3px solid var(--marker);border-radius:50% 50% 50% 2px;transform:rotate(-45deg)}
.body{cursor:pointer;padding-top:9px;min-width:0}
.lab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.02em;color:var(--muted)}
.here{display:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--marker-ink);background:var(--marker);border-radius:4px;padding:1px 6px}
.row.current .here{display:inline-block}
.instr{font-size:18px;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
.txt{background-image:linear-gradient(var(--strike),var(--strike));background-repeat:no-repeat;background-position:0 60%;background-size:0% 2.5px;transition:background-size .4s ease,color .25s}
.row.done .txt{background-size:100% 2.5px;color:var(--done)}
.rnote{font-size:14px;color:var(--muted);margin-top:4px;font-style:italic}
.row.done .rnote{opacity:.7}
.row.extra .label{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--plum);background:var(--plum-soft);border-radius:4px;padding:1px 7px}
.abbr-sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:12px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink);padding-top:30px;white-space:nowrap}
.count:not(:empty)::before{content:"("}
.count:not(:empty)::after{content:")"}
.row.done .count{color:var(--done)}
.more{width:40px;height:44px;margin-top:6px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.more:hover,.more[aria-expanded="true"]{background:var(--sunken)}
.more svg{width:18px;height:18px}
.menu,.explain,.editbox{grid-column:2/-1;margin-top:8px;margin-right:10px}
.menu{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:38px;padding-inline:14px;font-weight:700;font-size:14px}
.explain{background:var(--plum-soft);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.explain p{flex:1;white-space:pre-wrap}
.explain button{border:0;background:none;color:var(--muted);font-weight:700;min-height:32px}
.editbox{display:grid;gap:8px}
.editbox textarea{width:100%;min-height:80px;border:1.5px solid var(--line);background:var(--ground);border-radius:10px;padding:8px 10px}
.editbox input{width:10ch;border:1.5px solid var(--line);background:var(--ground);border-radius:10px;padding:8px 10px;min-height:40px}
.editrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pnotes{margin:0;padding-left:20px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--ground);border-radius:12px;padding:12px 16px;font-size:15px;z-index:20;box-shadow:0 6px 24px rgb(0 0 0 / .25)}

@media (max-width:520px){
  .two{grid-template-columns:1fr}
  .row{grid-template-columns:46px 1fr auto 36px}
  .tick{width:46px}
  .instr{font-size:17px}
  .card{grid-template-columns:1fr}
  .card-prog{order:3}
  .priv{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<header class="top">
  <div class="wrap topin">
    <button class="brand" data-action="home" aria-label="Rowkeeper — your patterns">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 10.5c5 2.5 11 2.5 16 0M4.2 15c5.5 2.8 12 2.8 17.6 0M9 3.6c3 5 3.4 13.6 1 19M17.2 3.8c-2.6 5.4-2.4 13.2.4 18.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Rowkeeper
    </button>
    <span class="priv">Private library</span>
    <span class="grow"></span>
    <button id="addBtn" class="btn primary" data-action="add">Add pattern</button>
  </div>
</header>
<main id="main" class="wrap"></main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAX_ASSET = 20 * 1024 * 1024;
const MAX_PAGES = 60;
const ICON_UP = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12.5 10 7.5l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_DOWN = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 12.5l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_BACK = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_MORE = `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/><circle cx="16" cy="10" r="1.8" fill="currentColor"/></svg>`;
const ICON_LOCK = `<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;

function freshAdd(){ return { kind:"file", files:[], video:null, link:"", captions:"", text:"", terms:"auto", title:"", notes:"", designer:"" }; }

const S = {
  view:"library", openId:null,
  patterns:[], pending:{},
  db:null, sample:null, assets:null, imgLimits:null,
  dbState:"connecting", sampleState:"connecting",
  example: makeExample(),
  add: freshAdd(),
  job:null, openMenu:null, explain:{}, editing:null, editDraft:null,
  armDelete:false, armReset:false, wake:null, wakeOn:false, renderKey:""
};

/* ---------- example (shown only while the library is empty) ---------- */
function makeExample(){
  const sections = [
    { name:"Head & body", notes:"Worked in continuous rounds — don't join. Move your stitch marker up to the first stitch of each round.", rows:[
      {label:"Setup", type:"row", text:"Make a MR.", count:"", note:""},

/* ---------- helpers ---------- */
const flatRows = p => (p?.sections || []).flatMap(s => s.rows || []);
function stats(p){ const rows = flatRows(p); const done = rows.filter(r => p.done?.[r.id]).length; return { rows, total:rows.length, done, cur:rows.find(r => !p.done?.[r.id]) }; }
function getPattern(id){
  if (id === "example") return S.example;
  return S.patterns.find(p => p.id === id) || S.pending[id] || null;
}
function replaceLocal(np){
  if (np.id === "example") { S.example = np; return; }
  const i = S.patterns.findIndex(p => p.id === np.id);
  if (i >= 0) S.patterns[i] = np; else S.pending[np.id] = np;
}
const structKey = p => JSON.stringify([p.title,p.designer,p.credit,p.hook,p.yarn,p.gauge,p.finishedSize,p.terminologyNote,p.materials,p.abbreviations,p.notes,p.sections,p.source]);
function sourceLabel(src){ return ({pdf:"From a PDF", images:"From photos", video:"From a video", text:"From pasted text", example:"Example"})[src?.kind] || "Pattern"; }
function creditOf(p){
  const c = p?.credit || {};
  return { designer:c.designer || p?.designer || "", handle:c.handle || "", website:c.website || "", link:c.link || p?.source?.link || "", copyright:c.copyright || "" };
}
function safeHref(u){
  u = String(u || "").trim();
  if (/^https?:\/\//i.test(u)) return u;
  if (/^(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(u)) return "https://" + u;
  return "";
}
function linkOrText(u, label){
  const h = safeHref(u);
  return h ? `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : `<span>${esc(u)}</span>`;
}
/* Standard US abbreviations: fills in any the pattern uses but didn't define, and serves as a reference list. */
const STANDARD_ABBR = [
  ["approx","approximately",/\bapprox\b/i],
  ["beg","beginning",/\bbeg\b/i],
  ["BLO","back loop only",/\bBLO\b/],
  ["BPdc","back post double crochet",/\bBPdc\b/i],
  ["ch","chain",/\bch\b/i],
  ["ch-sp","chain space",/\bch-sps?\b/i],
  ["cont","continue",/\bcont\b/i],
  ["dc","double crochet",/\bdc\b/i],
  ["dc2tog","double crochet 2 together (a decrease)",/\bdc2tog\b/i],
  ["dec","decrease (work 2 stitches together)",/\bdec\b/i],
  ["dtr","double treble crochet",/\bdtr\b/i],
  ["FLO","front loop only",/\bFLO\b/],
  ["FO","fasten off",/\bFO\b/],
  ["FPdc","front post double crochet",/\bFPdc\b/i],
  ["hdc","half double crochet",/\bhdc\b/i],
  ["hdc2tog","half double crochet 2 together (a decrease)",/\bhdc2tog\b/i],
  ["inc","increase (2 stitches in the same stitch)",/\binc\b/i],
  ["invdec","invisible decrease: sc 2 together through the front loops only",/\binvdec\b/i],
  ["lp(s)","loop(s)",/\blps?\b/i],
  ["MR","magic ring",/\bMR\b/],
  ["pm","place marker",/\bpm\b/],
  ["rem","remaining",/\brem\b/i],
  ["rep","repeat",/\brep\b/i],
  ["rnd(s)","round(s)",/\brnds?\b/i],
  ["RS","right side",/\bRS\b/],
  ["sc","single crochet",/\bsc\b/i],
  ["sc2tog","single crochet 2 together (a decrease)",/\bsc2tog\b/i],
  ["sk","skip",/\bsk\b/i],
  ["sl st","slip stitch",/\bsl st\b/i],
  ["sp(s)","space(s)",/\bsps?\b/i],
  ["st(s)","stitch(es)",/\bsts?\b/i],
  ["tch","turning chain",/\btch\b/i],
  ["tog","together",/\btog\b/i],
  ["tr","treble crochet",/\btr\b/i],
  ["WS","wrong side",/\bWS\b/],
  ["yo","yarn over",/\byo\b/i]
];
const abbrKey = s => String(s).toLowerCase().replace(/\(s\)$/, "").replace(/^(st|rnd|sp|lp|ch-sp)s$/, "$1").trim();
function abbrevsFor(p){
  const own = (p?.abbreviations || []).filter(a => a.abbr);
  const have = new Set(own.map(a => abbrKey(a.abbr)));
  const text = flatRows(p).map(r => r.text).join("\n");
  const found = STANDARD_ABBR.filter(([ab, , re]) => !have.has(abbrKey(ab)) && re.test(text)).map(([abbr, meaning]) => ({ abbr, meaning }));
  return [...own, ...found];
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5200); }
const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
const canvasBlob = (c, q = .85) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("canvas")), "image/jpeg", q));
function fmtDate(ms){ if (!ms) return ""; try { return new Date(ms).toLocaleDateString(undefined, {month:"short", day:"numeric"}); } catch { return ""; } }

const queues = {};
function writeDoc(id, fn){
  queues[id] = (queues[id] || Promise.resolve()).then(fn).catch(e => toast(dbErrorCopy(e)));
  return queues[id];
}
function dbErrorCopy(e){
  switch (e?.code){
    case "quota_exceeded": return "Your library is full. Delete a pattern you've finished, then try again.";
    case "resource_exhausted": return "Saving too quickly — wait a moment and try again.";
    case "revoked": case "not_granted": return "Saving isn't available on this page anymore. Reload to reconnect.";
    default: return "Couldn't save that change. Check your connection and try again.";
  }
}
function sampleErrorCopy(e){
  switch (e?.code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      return "Claude isn't allowed to run on this page, so it can't translate. Reload and choose Allow when Claude asks.";
    case "rate_limited": return "You've reached your Claude usage limit for now. Wait a while, then try again.";
    case "session_expired": return "Your Claude sign-in expired. Sign in again, then try again.";
    case "images_unavailable": return "This view can't send pictures to Claude. Paste the pattern text instead.";
    case "image_rejected": return "Claude couldn't read one of the pictures. Try a JPEG or PNG screenshot.";
    case "prompt_too_large": return "That pattern is too long for one go. Add it in parts — one section at a time.";
    case "invalid_json": return "Claude's answer came back incomplete, usually because the pattern is very long. Try again, or add one section at a time.";
    case "refused": return "Claude declined to translate this. Check that the file is a crochet pattern.";
    case "empty_completion": return "Claude didn't find a pattern in that. Check the file, or add the captions.";
    default: return "Couldn't reach Claude just now. Try again.";
  }
}

/* ---------- rendering ---------- */
function barHTML(p){
  const { rows, total, done } = stats(p);
  if (!total) return "";
  if (total > 60) return `<span class="bar fill" aria-hidden="true"><i style="width:${(done/total*100).toFixed(1)}%"></i></span>`;
  return `<span class="bar" aria-hidden="true">${rows.map(r => `<span class="seg${p.done?.[r.id] ? " on" : ""}"></span>`).join("")}</span>`;
}

function cardHTML(p){
  const { total, done } = stats(p);
  const who = creditOf(p).designer || creditOf(p).handle;
  const meta = [who && p.id !== "example" ? "by " + who : "", sourceLabel(p.source), p.updatedAt ? "worked on " + fmtDate(p.updatedAt) : ""].filter(Boolean).join(" · ");
  return `<li><button class="card" data-action="open" data-id="${esc(p.id)}">
    <span><span class="card-title">${esc(p.title)}</span>${p.id === "example" ? `<span class="tag">Example</span>` : ""}
    <span class="card-meta">${esc(meta)}</span></span>
    <span class="card-prog"><span class="num">${done}/${total}</span> rows</span>
    ${barHTML(p)}
  </button></li>`;
}

function renderLibrary(){
  let h = `<section class="intro">
    <h1>Every pattern, one row at a time.</h1>
    <p>Add a PDF, photos, a video clip or copied captions. Claude rewrites it as a checklist in US crochet terms, and you cross off each row as you finish it.</p>
  </section>`;
  if (S.sampleState === "off") h += `<p class="banner">Claude isn't available in this view, so new patterns can't be translated here. Your saved patterns still work.</p>`;
  if (S.dbState === "off") h += `<p class="banner">Saving isn't available in this view. Open the page from your claude.ai account to keep patterns.</p>`;
  const mine = [...S.patterns, ...Object.values(S.pending).filter(p => !S.patterns.some(x => x.id === p.id))];
  if (S.dbState === "connecting") h += `<p class="quiet">Opening your library…</p>`;
  else if (mine.length) h += `<ul class="lib">${mine.map(cardHTML).join("")}</ul>`;
  else h += `<div class="empty"><p class="quiet">No patterns yet. Open the example to see how it works — tap a row to cross it off.</p><ul class="lib">${cardHTML(S.example)}</ul></div>`;
  h += `<p class="foot">${ICON_LOCK}<span>Your patterns stay private. Only you can open them. There are no feeds, forums or sharing, and nothing you add is posted anywhere.</span></p>`;
  return h;
}

    ${has ? "" : `<p class="missing">No materials were listed in what you added.${canEdit ? " Tap Add to write them in." : ""}</p>`}
  </section>`;
}
function creditCard(p, canEdit){
  if (S.editInfo === "credit"){
    const d = S.infoDraft;
    const fld = (k, label, ph, type = "text") => `<div class="field"><label for="ci-${k}">${label}</label><input id="ci-${k}" type="${type}" data-info="${k}" placeholder="${esc(ph)}" value="${esc(d[k])}"></div>`;
    return `<section class="icard" aria-labelledby="cr-h">
      <div class="icard-h"><h2 id="cr-h">Pattern credit</h2></div>
      <div class="infoedit">
        ${fld("designer","Designer","Their name or studio")}
        ${fld("handle","Social handle","@name")}
        ${fld("website","Shop or website","e.g. etsy.com/shop/…")}
        ${fld("link","Link to the original","Post, video or listing","url")}
        ${fld("copyright","Copyright or usage note","e.g. © 2026 — personal use only")}
        ${editButtons()}
      </div>
    </section>`;
  }
  const c = creditOf(p);
  const name = c.designer || c.handle;
  const lines = [c.designer && c.handle ? `<span>${esc(c.handle)}</span>` : "", c.website ? linkOrText(c.website, c.website) : "", c.link ? linkOrText(c.link, "View the original") : ""].filter(Boolean);
  return `<section class="icard" aria-labelledby="cr-h">
    <div class="icard-h"><h2 id="cr-h">Pattern credit</h2>${canEdit ? `<button class="linkbtn" data-action="editinfo" data-which="credit">${name || lines.length ? "Edit" : "Add"}</button>` : ""}</div>
    ${name ? `<p class="credit-name"><small>Designed by</small>${esc(name)}</p>` : `<p class="missing">The designer wasn't named in what you added.${canEdit ? " Tap Add so this pattern always credits its maker." : ""}</p>`}
    ${lines.length ? `<div class="credit-lines">${lines.join("")}</div>` : ""}

function renderPattern(p){
  if (!p) return `<button class="back" data-action="home">${ICON_BACK}Patterns</button><p class="quiet">That pattern isn't in your library anymore.</p>`;
  const canEdit = p.id !== "example";
  const who = creditOf(p).designer || creditOf(p).handle;
  const src = p.source || {};
  const files = src.files || [];
  let origs = "";
  if (files.length || src.link){
    origs = `<div class="origs">${files.map(f =>
      f.type.startsWith("image/") ? `<a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener"><img src="/_blob/${esc(f.id)}" alt="${esc(f.name)}"></a>`
      : f.type.startsWith("video/") ? `<video src="/_blob/${esc(f.id)}" controls playsinline preload="metadata"></video>`
      : `<a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">Open ${esc(f.name)}</a>`).join("")}
      ${src.link ? `<a href="${esc(src.link)}" target="_blank" rel="noopener noreferrer">Open the original video link</a>` : ""}
    </div>${src.unsaved ? `<p class="hint">${esc(src.unsaved)}</p>` : ""}`;
  } else if (src.unsaved) origs = `<p class="hint">${esc(src.unsaved)}</p>`;

  const info = [];
  const abbrs = abbrevsFor(p);
  const usedAbbr = new Set(abbrs.map(x => abbrKey(x.abbr)));
  const otherAbbr = STANDARD_ABBR.filter(([ab]) => !usedAbbr.has(abbrKey(ab)));
  const abbrTable = list => `<table class="abbr"><tbody>${list.map(x => `<tr><td>${esc(x.abbr)}</td><td>${esc(x.meaning)}</td></tr>`).join("")}</tbody></table>`;
  info.push(`<details class="more-info"><summary>Abbreviations <span class="c">${abbrs.length}</span></summary><div class="dbody">
    ${abbrs.length ? `<p class="abbr-sub">In this pattern</p>${abbrTable(abbrs)}` : `<p class="missing">No abbreviations found in this pattern.</p>`}
    ${otherAbbr.length ? `<p class="abbr-sub">Other common US abbreviations</p>${abbrTable(otherAbbr.map(([abbr, meaning]) => ({ abbr, meaning })))}` : ""}
  </div></details>`);
  if (p.notes?.length) info.push(`<details class="more-info"><summary>Pattern notes <span class="c">${p.notes.length}</span></summary><div class="dbody"><ul class="pnotes">${p.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div></details>`);
  if (origs) info.push(`<details class="more-info"><summary>Original</summary><div class="dbody">${origs}</div></details>`);

  const canWake = "wakeLock" in navigator;
  const secs = (p.sections || []).map(s => {
    const d = s.rows.filter(r => p.done?.[r.id]).length;
    return `<section class="sec">
      <header class="sechead"><h2>${esc(s.name)}</h2><span class="secprog num" data-sec="${s.id}">${d}/${s.rows.length}</span></header>
      ${s.notes ? `<p class="secnote">${esc(s.notes)}</p>` : ""}
      <ol class="rows">${s.rows.map(r => rowHTML(p, r)).join("")}</ol>
    </section>`;
  }).join("");

  const html = `
    <button class="back" data-action="home">${ICON_BACK}Patterns</button>
    <div class="phead">
      <span class="eyebrow">${esc(sourceLabel(src))}${p.id === "example" ? " · not saved" : ""}</span>
      <h1>${esc(p.title)}</h1>
      ${who ? `<p class="by">by ${esc(who)}</p>` : ""}
    </div>
    <div class="prog" id="prog">${progHTML(p)}</div>
    <div class="tools">
      <button class="btn" data-action="jump">Go to my row</button>
      ${canWake ? `<button class="btn" id="wakeBtn" data-action="wake" aria-pressed="${S.wakeOn}">Keep screen on</button>` : ""}
      <button class="btn ghost${S.armReset ? " danger armed" : ""}" data-action="reset">${S.armReset ? "Tap again to uncheck all" : "Start over"}</button>
      ${p.id !== "example" ? `<button class="btn danger${S.armDelete ? " armed" : ""}" data-action="delete">${S.armDelete ? "Tap again to delete" : "Delete"}</button>` : ""}
    </div>
    ${p.terminologyNote ? `<p class="terms">${esc(p.terminologyNote)}</p>` : ""}
    <div class="infogrid">${materialsCard(p, canEdit)}${creditCard(p, canEdit)}</div>
    ${info.length ? `<div class="infos">${info.join("")}</div>` : ""}
    ${secs}`;
  return html;
}

function paintCurrent(p){
  const { rows, cur } = stats(p);
  for (const r of rows){
    const li = document.getElementById("row-" + r.id);
    if (!li) continue;
    const d = !!p.done?.[r.id];
    li.classList.toggle("done", d);
    li.classList.toggle("current", cur?.id === r.id);
    li.querySelector(".tick")?.setAttribute("aria-pressed", String(d));
  }
  const prog = $("#prog"); if (prog) prog.innerHTML = progHTML(p);
  for (const s of p.sections || []){
    const el = document.querySelector(`[data-sec="${s.id}"]`);
    if (el) el.textContent = `${s.rows.filter(r => p.done?.[r.id]).length}/${s.rows.length}`;
  }
}

function render(){

  $("#addBtn").hidden = S.view !== "library";
  if (S.view === "library") main.innerHTML = renderLibrary();
  else if (S.view === "add"){ main.innerHTML = renderAdd(); paintJob(); bindDrop(); paintThumbs(); }

function go(view, id){

/* ---------- add form wiring ---------- */
function bindDrop(){
  const drop = $("#drop"); if (!drop) return;
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");

const thumbs = new WeakMap();
async function paintThumbs(){
  for (const c of document.querySelectorAll("canvas[data-thumb]")){
    const f = S.add.files[+c.dataset.thumb];
    if (!f) continue;
    try {
      let bmp = thumbs.get(f);
      if (!bmp){
        try { bmp = await createImageBitmap(f, { resizeWidth:96, resizeQuality:"medium" }); }
        catch { bmp = await createImageBitmap(f); }
        thumbs.set(f, bmp);
      }
      if (!c.isConnected) continue;
      const k = 80 / Math.max(bmp.width, bmp.height);
      c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    } catch {}
  }
}
function takeFiles(list){
  if (!list.length) return;
  if (S.add.kind === "video"){ S.add.video = list.find(f => f.type.startsWith("video/")) || list[0]; }
  else S.add.files = [...S.add.files, ...list];

}
document.addEventListener("change", e => {
  if (e.target.id === "fileIn" || e.target.id === "videoIn") takeFiles([...e.target.files]);
  else if (e.target.dataset.field) S.add[e.target.dataset.field] = e.target.value;
});
document.addEventListener("input", e => {
  if (e.target.dataset.field) S.add[e.target.dataset.field] = e.target.value;
  if (e.target.dataset.edit && S.editDraft) S.editDraft[e.target.dataset.edit] = e.target.value;

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action, rid = el.dataset.row;
  const p = S.view === "pattern" ? getPattern(S.openId) : null;
  if (a !== "delete") S.armDelete = false;
  if (a !== "reset") S.armReset = false;
  switch (a){
    case "home": go("library"); break;
    case "add": go("add"); break;
    case "open": go("pattern", el.dataset.id); break;
    case "kind": S.add.kind = el.dataset.kind; S.job = null; render(); break;
    case "rmfile": S.add.files.splice(+el.dataset.i, 1); render(); break;
    case "moveup": case "movedown": {
      const f = S.add.files, i = +el.dataset.i, j = a === "moveup" ? i - 1 : i + 1;
      if (j < 0 || j >= f.length) break;
      [f[i], f[j]] = [f[j], f[i]];
      render();
      document.querySelector(`[data-action="${a}"][data-i="${j}"]`)?.focus();
      break;
    }
    case "editinfo": startInfoEdit(p, el.dataset.which); break;
    case "cancelinfo": S.editInfo = null; render(); break;
    case "saveinfo": saveInfo(p); break;
    case "translate": translate(); break;
    case "stop": S.job?.ctl?.abort(); break;
    case "toggle":
      if (window.getSelection()?.toString()) return;
      toggleRow(p, rid); break;
    case "menu": S.openMenu = S.openMenu === rid ? null : rid; render(); break;
    case "explain": explainRow(p, rid); break;
    case "closeex": delete S.explain[rid]; render(); break;
    case "edit": {
      const r = flatRows(p).find(x => x.id === rid);
      S.editing = rid; S.openMenu = null; S.editDraft = { text:r.text, count:r.count || "" };
      render(); $("#edit-text")?.focus(); break;
    }
    case "canceledit": S.editing = null; render(); break;
    case "saveedit": saveEdit(p, rid); break;
    case "jump": {
      const cur = stats(p).cur;
      document.getElementById("row-" + (cur?.id || ""))?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center" });
      break;
    }
    case "wake": toggleWake(); break;
    case "reset":
      if (!S.armReset){ S.armReset = true; render(); break; }
      resetProgress(p); break;
    case "delete":
      if (!S.armDelete){ S.armDelete = true; render(); break; }
      deletePattern(p); break;
  }
});

function toggleRow(p, rid){
  if (!p || !rid) return;
  const now = !p.done?.[rid];
  const np = { ...p, done:{ ...(p.done || {}), [rid]:now }, updatedAt: p.id === "example" ? 0 : Date.now() };
  replaceLocal(np);
  if ($(".tools .armed")) render(); else paintCurrent(np);
  if (p.id !== "example" && S.db && !String(p.id).startsWith("local-"))
    writeDoc(p.id, () => S.db.doc("patterns/" + p.id).update({ done:{ [rid]:now }, updatedAt:np.updatedAt }));
}

function resetProgress(p){
  S.armReset = false;
  const cleared = Object.fromEntries(Object.keys(p.done || {}).map(k => [k, false]));
  const np = { ...p, done:cleared, updatedAt: p.id === "example" ? 0 : Date.now() };
  replaceLocal(np); render();
  if (p.id !== "example" && S.db && !String(p.id).startsWith("local-"))
    writeDoc(p.id, () => S.db.doc("patterns/" + p.id).update({ done:cleared, updatedAt:np.updatedAt }));
}

async function deletePattern(p){
  S.armDelete = false;
  const id = p.id;
  S.patterns = S.patterns.filter(x => x.id !== id); delete S.pending[id];
  go("library");
  try {
    if (S.db && !String(id).startsWith("local-")) await S.db.doc("patterns/" + id).delete();
    if (S.assets) for (const f of p.source?.files || []) { try { await S.assets.delete(f.id); } catch {} }
    toast(`Deleted “${p.title}”.`);
  } catch (e){ toast(dbErrorCopy(e)); }
}

function saveEdit(p, rid){
  const text = (S.editDraft?.text || "").trim();
  if (!text){ toast("A row needs some instructions. Cancel to keep the original."); return; }
  const sections = p.sections.map(s => ({ ...s, rows:s.rows.map(r => r.id === rid ? { ...r, text, count:(S.editDraft.count || "").trim() } : r) }));
  const np = { ...p, sections, updatedAt:Date.now() };
  S.editing = null; replaceLocal(np); render();
  if (S.db && !String(p.id).startsWith("local-"))
    writeDoc(p.id, () => S.db.doc("patterns/" + p.id).update({ sections, updatedAt:np.updatedAt }));
}

function startInfoEdit(p, which){
  if (!p) return;
  S.editInfo = which; S.openMenu = null; S.editing = null;
  S.infoDraft = which === "credit" ? creditOf(p)
    : { materials:(p.materials || []).join("\n"), hook:p.hook || "", yarn:p.yarn || "", gauge:p.gauge || "", finishedSize:p.finishedSize || "" };
  render();
  document.querySelector("[data-info]")?.focus();
}
function saveInfo(p){
  const d = S.infoDraft || {};
  const t = k => String(d[k] || "").trim();
  const patch = S.editInfo === "credit"
    ? { credit:{ designer:t("designer"), handle:t("handle"), website:t("website"), link:t("link"), copyright:t("copyright") }, designer:t("designer") }
    : { materials:String(d.materials || "").split("\n").map(s => s.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean),
        hook:t("hook"), yarn:t("yarn"), gauge:t("gauge"), finishedSize:t("finishedSize") };
  patch.updatedAt = Date.now();
  const np = { ...p, ...patch };
  S.editInfo = null; replaceLocal(np); render();
  if (S.db && !String(p.id).startsWith("local-"))
    writeDoc(p.id, () => S.db.doc("patterns/" + p.id).update(patch));
}

async function explainRow(p, rid){
  if (!S.sample){ toast("Claude isn't available in this view."); return; }
  const rows = flatRows(p); const i = rows.findIndex(r => r.id === rid); const r = rows[i];
  const sec = p.sections.find(s => s.rows.some(x => x.id === rid));
  S.explain[rid] = { loading:true }; S.openMenu = null; render();
  const prev = rows[i - 1];
  const prompt = `Explain one step of a crochet pattern (US terms) to someone working on it right now. In 2–4 short, plain sentences: what to do and how, and how to check it's right — the stitch count for a row, or placement and neatness for stuffing, safety eyes, embroidery or sewing. No headings, lists or emoji.

Pattern: ${p.title}
Section: ${sec?.name || ""}
Abbreviations: ${abbrevsFor(p).map(a => `${a.abbr} = ${a.meaning}`).join("; ") || "standard US"}
Pattern notes: ${(p.notes || []).join(" ").slice(0, 1500) || "none"}
Previous row: ${prev ? `${prev.label}: ${prev.text}${prev.count ? ` (${prev.count})` : ""}` : "none — this is the first"}
This row: ${r.label}: ${r.text}${r.count ? ` (${r.count})` : ""}${r.note ? `\nNote: ${r.note}` : ""}`;
  const paint = () => { const el = document.getElementById("ex-" + rid); const x = S.explain[rid]; if (el && x) el.textContent = x.text || x.error || "Thinking…"; };
  try {
    const { text } = await S.sample(prompt, { modelTier:"quick", onText:({ text }) => { S.explain[rid] = { text }; paint(); } });
    S.explain[rid] = { text };
  } catch (e){
    if (e?.code === "cancelled") return;
    S.explain[rid] = { error: sampleErrorCopy(e) };
  }
  paint();
}

function paintJob(){

function validate(){
  const a = S.add;
  if (!S.sample) return "Translating needs Claude, which isn't available in this view.";
  if (a.kind === "file"){
    if (!a.files.length) return "Choose a PDF or some photos first.";
    const pdfs = a.files.filter(isPdf);
    if (pdfs.length > 1 || (pdfs.length && a.files.length > 1)) return "Add one PDF at a time, or photos — not both together.";
    if (!pdfs.length){
      if (!S.imgLimits) return "This view can't send photos to Claude. Paste the pattern text instead.";
      if (a.files.length > MAX_PAGES) return `Add up to ${MAX_PAGES} screenshots at a time. For a longer pattern, add it in two parts.`;
    }
  }
  if (a.kind === "video"){
    if (!a.video && !a.captions.trim()) return "Add a video clip, or paste the captions or transcript.";
    if (a.video && !S.imgLimits && !a.captions.trim()) return "This view can't send video stills to Claude. Paste the captions or transcript instead.";
  }
  if (a.kind === "text" && a.text.trim().length < 20) return "Paste the pattern text first.";
  return null;
}

let pdfjsPromise;
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script")); document.head.appendChild(s); });
}
function loadPdfjs(){
  return pdfjsPromise ||= (async () => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base + "pdf.min.js");
    await loadScript(base + "pdf.worker.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    return window.pdfjsLib;
  })().catch(e => { pdfjsPromise = null; throw e; });
}
async function renderPdfPage(doc, n){
  const page = await doc.getPage(n);
  const v1 = page.getViewport({ scale:1 });
  const vp = page.getViewport({ scale: Math.min(2.5, 1400 / v1.width) });
  const c = document.createElement("canvas"); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext:ctx, viewport:vp }).promise;
  return canvasBlob(c);
}
async function prepImages(files){
  const lim = S.imgLimits;
  const out = [];
  for (const f of files){
    if (lim.mediaTypes.includes(f.type) && f.size <= lim.maxInputBytes){ out.push(f); continue; }
    try {
      const bmp = await createImageBitmap(f);
      const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      out.push(await canvasBlob(c));
    } catch { throw { user:`Couldn't read “${f.name}”. Use a JPEG or PNG screenshot instead.` }; }
  }
  return out;
}
function waitEvent(el, ev, ms){
  return new Promise((res, rej) => {
    const finish = (ok) => { clearTimeout(t); el.removeEventListener(ev, onOk); el.removeEventListener("error", onErr); ok ? res() : rej(new Error("media")); };
    const onOk = () => finish(true), onErr = () => finish(false);
    const t = setTimeout(() => finish(false), ms);
    el.addEventListener(ev, onOk); el.addEventListener("error", onErr);
  });
}
async function videoFrames(src, n, onP){
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto";
  const loaded = waitEvent(v, "loadeddata", 20000);
  v.src = src; v.load();
  await loaded;
  const dur = v.duration;
  if (!isFinite(dur) || dur <= 0) throw new Error("duration");
  const k = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  const ctx = c.getContext("2d");
  const blobs = [];
  for (let i = 0; i < n; i++){
    const seeked = waitEvent(v, "seeked", 10000);
    v.currentTime = Math.min(dur - 0.05, dur * (i + 0.5) / n);
    await seeked;
    ctx.drawImage(v, 0, 0, c.width, c.height);
    blobs.push(await canvasBlob(c, .8));
    onP?.(i + 1);
  }
  v.removeAttribute("src"); v.load();
  return { blobs, duration:dur };
}
function assetType(f){
  if (isPdf(f)) return "application/pdf";
  if (["image/png","image/jpeg","image/gif","image/webp"].includes(f.type)) return f.type;
  if (f.type === "video/mp4" || f.type === "video/webm") return f.type;
  if (f.type === "video/quicktime" || /\.(mov|m4v)$/i.test(f.name)) return "video/mp4";
  return null;
}
async function uploadOne(f){
  const type = assetType(f);
  if (!type) throw { code:"unsupported_type" };
  if (f.size > MAX_ASSET) throw { code:"too_large" };
  const r = await S.assets.upload(f, { type });
  return { id:r.id, url:r.url, name:f.name, type:r.contentType };
}

async function transcribe(images, per, noun, signal, check){
  const total = images.length, batches = Math.ceil(total / per);
  const one = { pages:"Page", slides:"Slide" }[noun] || "Picture";
  let out = "";
  for (let k = 0; k < batches; k++){
    check();
    const start = k * per + 1, end = Math.min(total, (k + 1) * per);
    stage(`Reading ${noun} ${start}–${end} of ${total}…`);
    const { text, truncated } = await S.sample(
`These ${end - start + 1} pictures are ${noun} ${start}–${end} of ${total} from one crochet pattern, in order. Transcribe everything that belongs to the pattern, exactly as written and in reading order: title, designer name, social handle, website or shop, copyright or usage notice, materials, gauge, sizes, abbreviations, special stitches, notes, every row or round with its stitch count, and every other step such as stuffing, safety eye placement, embroidery, sewing and assembly. If a picture shows a chart or diagram, describe it in words row by row as far as you can read it. Keep the original stitch terms; don't convert between UK and US. Start each picture's text with a line like "[${one} ${start}]". A row may continue from the previous picture: transcribe it as it appears. Plain text only, no commentary or summary.`,
      { images:images.slice(start - 1, end), signal });
    out += `${text.trim()}${truncated ? `\n[${one}s ${start}–${end}: this transcript was cut off before the end.]` : ""}\n\n`;
  }
  return out;
}

function buildPrompt(ctx){
  const termLine = {
    auto:"Unknown — work it out. A pattern that never uses “sc” but uses “dc” and “tr” is almost certainly UK.",
    us:"The person says the source already uses US terms.",
    uk:"The person says the source uses UK/Australian terms — convert every stitch to US terms."
  }[ctx.terms];
  return `Turn a crochet pattern into a row-by-row checklist a person will follow while they crochet, written in standard US crochet terms and Craft Yarn Council abbreviations.

WHAT YOU'RE GIVEN
${ctx.describe}
Source terminology: ${termLine}
${ctx.title ? `The person calls this pattern: ${ctx.title}\n` : ""}${ctx.designer ? `The person says the designer is: ${ctx.designer}\n` : ""}${ctx.notes ? `Notes from the person: ${ctx.notes}\n` : ""}
RULES
1. US terms only. From UK terms convert: dc→sc, htr→hdc, tr→dc, dtr→tr, ttr→dtr, miss→sk, tension→gauge, yrh→yo. In "terminologyNote" say in one sentence what the source used and what you converted, e.g. "Source used UK terms; converted to US (UK dc → sc, UK tr → dc)." or "Source already used US terms."
2. Abbreviations: ch, sl st, sc, hdc, dc (double crochet), tr, dtr, st(s), sp, sk (skip), yo, inc (increase), dec (decrease), sc2tog, hdc2tog, dc2tog, invdec, MR, FO, BLO, FLO, FPdc, BPdc, RS, WS, rnd(s), rep, beg, tog, pm, approx. Always write "sk" for skip, "dec" for decrease and "dc" for double crochet. Lowercase except MR, FO, BLO, FLO, RS, WS, FP/BP. In "abbreviations" list every abbreviation you used plus any special stitches, each with a plain-English meaning.
3. One checklist item per row or round, in working order, so each can be crossed off. Expand ranges like "Rnds 5–9: sc around (30)" into separate items "Rnd 5" … "Rnd 9". Only if a range covers more than 40 rows, keep it as one item and say how many rows it covers in "note".
4. Keep repeats in pattern notation: "*Sc in next st, inc in next st* 6 times." or "*…*; rep from * around." Put the stitch count for the end of the row in "count" as just the number ("18"), or "" if none.
5. Group items into sections that follow the pattern (e.g. "Body", "Arms (make 2)", "Border", "Finishing"). Setup steps like "Make a MR" or "Ch 21" are their own items. Label items like "Row 12", "Rnd 3", or "Step" for anything that isn't a numbered row.
6. For video stills, captions or transcripts without a written pattern: work out the steps from what is shown and said. When you had to guess a stitch or count, give your best reading and start "note" with "Check the video:".
7. Never invent materials, hook sizes or gauge the source doesn't give — use "".
8. "text" is the instruction only. No pleasantries, no emoji.
9. Materials: in "materials" list everything the pattern says you need, one item per entry: yarn (brand, weight, colors, amounts), hooks, and notions such as stitch markers, stuffing (e.g. polyester fiberfill), safety eyes or noses with their size, embroidery floss, pins, pellets, buttons, tapestry needle. Also give short summaries in "hook" and "yarn".
10. Credit: in "credit", copy the designer's name, social handle (like @name), shop or website, and any copyright or usage notice exactly as the source shows them. Look in captions, headers, footers, watermarks and the last slide or page. If only a handle is shown, leave "designer" "". Never guess.
11. Pages or slides can split a row, a section or the materials list across pictures. Join everything into one continuous pattern and never repeat a row.
12. Amigurumi and other assembled items: steps that aren't crocheting are their own checklist items, placed exactly where the pattern does them — stuffing ("Stuff firmly."), inserting safety eyes or noses (between which rnds, how many sts apart), embroidering faces, sewing or attaching pieces (and where), closing a piece, fastening off, leaving a long tail for sewing, weaving in ends. Give every item a "type": "row" for crocheted rows, rounds and setup chains; "stuff"; "eyes" for eyes, noses and other inserted parts; "sew" for sewing, attaching and assembly; "embroider"; "finish" for fastening off, closing and weaving in; or "other". Label those non-row items with a short word: "Stuff", "Eyes", "Sew", "Embroider", "Finish".
13. Pieces made more than once ("Arms (make 2)"): if the piece has 15 or fewer items, write the section out once per copy — "Arm (1 of 2)", "Arm (2 of 2)" — so each copy can be crossed off. Longer pieces stay one section with "(make 2)" in the name. Put joining pieces in an "Assembly" section at the end, unless the pattern attaches pieces as it goes.

REPLY WITH ONLY JSON IN EXACTLY THIS SHAPE (no markdown):
{"title": "", "credit": {"designer": "", "handle": "", "website": "", "copyright": ""}, "terminologyNote": "", "hook": "", "yarn": "", "gauge": "", "finishedSize": "", "materials": [""], "abbreviations": [{"abbr": "sc", "meaning": "single crochet"}], "notes": [""], "sections": [{"name": "", "notes": "", "rows": [{"label": "Rnd 3", "type": "row", "text": "*Sc in next st, inc in next st* 6 times.", "count": "18", "note": ""}, {"label": "Stuff", "type": "stuff", "text": "Stuff firmly.", "count": "", "note": ""}]}]}
${ctx.body ? `\nSOURCE\n"""\n${ctx.body}\n"""` : ""}`;
}

const ROW_TYPES = ["row","stuff","eyes","sew","embroider","finish","other"];
function normalize(raw){
  const o = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const str = v => typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
  const strs = v => (Array.isArray(v) ? v : []).map(str).filter(Boolean);
  const sections = (Array.isArray(o.sections) ? o.sections : [])
    .map(s => ({ name:str(s?.name), notes:str(s?.notes),
      rows:(Array.isArray(s?.rows) ? s.rows : []).map(r => ({ label:str(r?.label), type:ROW_TYPES.includes(str(r?.type)) ? str(r.type) : "row", text:str(r?.text ?? r?.instruction), count:str(r?.count), note:str(r?.note) })).filter(r => r.text) }))
    .filter(s => s.rows.length)
    .map((s, i) => ({ id:"s"+i, name:s.name || `Part ${i+1}`, notes:s.notes, rows:s.rows.map((r, j) => ({ id:`s${i}r${j}`, ...r })) }));
  const cr = o.credit && typeof o.credit === "object" ? o.credit : {};
  const credit = { designer:str(cr.designer ?? o.designer), handle:str(cr.handle), website:str(cr.website), link:"", copyright:str(cr.copyright) };
  return {
    title:str(o.title) || "Untitled pattern", designer:credit.designer, credit, terminologyNote:str(o.terminologyNote),
    hook:str(o.hook), yarn:str(o.yarn), gauge:str(o.gauge), finishedSize:str(o.finishedSize),
    materials:strs(o.materials), notes:strs(o.notes),
    abbreviations:(Array.isArray(o.abbreviations) ? o.abbreviations : []).map(a => ({ abbr:str(a?.abbr), meaning:str(a?.meaning) })).filter(a => a.abbr),
    sections
  };
}

async function translate(){
  const problem = validate();
  if (problem){ S.job = { error:problem }; paintJob(); return; }
  const a = S.add;
  const ctl = new AbortController();
  const check = () => { if (ctl.signal.aborted) throw { code:"cancelled" }; };
  S.job = { ctl, stage:"Getting ready…" }; paintJob();
  const perCall = S.imgLimits ? Math.min(S.imgLimits.maxCount, 20) : 0;
  const captions = a.captions.trim(), link = a.link.trim();
  const ctx = { terms:a.terms, title:a.title.trim(), notes:a.notes.trim(), designer:a.designer.trim(), body:"", describe:"" };
  const say = [], parts = [];
  let images = [], noun = "pictures", picsExplained = false;
  const source = { kind:a.kind === "file" ? "images" : a.kind };
  if (link) source.link = link;
  let uploadedVideo = null;
  try {
    if (a.kind === "file"){
      const pdf = a.files.find(isPdf);
      if (pdf){
        source.kind = "pdf"; noun = "pages";
        stage("Opening the PDF…");
        const lib = await loadPdfjs().catch(() => { throw { user:"Couldn't load the PDF reader. Check your connection and try again." }; });
        let doc;
        try { doc = await lib.getDocument({ data: await pdf.arrayBuffer(), isEvalSupported:false }).promise; }
        catch { throw { user:`Couldn't open “${pdf.name}”. If it's password-protected, save an unlocked copy or take screenshots instead.` }; }
        let text = "";
        for (let i = 1; i <= doc.numPages; i++){
          check(); stage(`Reading page ${i} of ${doc.numPages}…`);
          const tc = await (await doc.getPage(i)).getTextContent();
          text += `\n--- Page ${i} ---\n` + tc.items.map(it => (it.str || "") + (it.hasEOL ? "\n" : " ")).join("");
        }
        const hasText = text.replace(/--- Page \d+ ---/g, "").replace(/\s+/g, "").length > 200;
        if (hasText){
          const n = Math.min(perCall, doc.numPages, 4);
          for (let i = 1; i <= n; i++){ check(); stage(`Looking at page ${i} of ${n}…`); images.push(await renderPdfPage(doc, i)); }
          parts.push(`PDF TEXT\n${text}`);
          say.push(`A PDF pattern named “${pdf.name}” with ${doc.numPages} page(s); its text is below.${n ? ` Pictures of ${n > 1 ? `pages 1–${n}` : "page 1"} are attached so you can read charts, photos and tables.` : ""}`);
          picsExplained = true;
        } else {
          if (!perCall) throw { user:"This PDF is scanned (it has no text), and this view can't send pictures to Claude. Paste the pattern text instead." };
          const n = Math.min(doc.numPages, MAX_PAGES);
          for (let i = 1; i <= n; i++){ check(); stage(`Looking at page ${i} of ${n}…`); images.push(await renderPdfPage(doc, i)); }
          say.push(`A scanned PDF pattern named “${pdf.name}” with ${doc.numPages} page(s) and no selectable text.${doc.numPages > n ? ` Only the first ${n} pages were read: add a pattern note saying the rest wasn't included.` : ""}`);
        }
      } else {
        noun = "slides";
        stage("Preparing your screenshots…");
        images = await prepImages(a.files.slice(0, MAX_PAGES));
        say.push(`${images.length} screenshot(s) or photo(s) of one crochet pattern (for example every slide of an Instagram post), in order.`);
      }
    }
    if (a.kind === "video"){
      let dur = 0;
      if (a.video && perCall){
        const want = Math.min(perCall, 16);
        const onP = i => stage(`Taking stills from the video… ${i} of ${want}`);
        stage("Opening the video…");
        let frames;
        const blobUrl = URL.createObjectURL(a.video);
        try { frames = await videoFrames(blobUrl, want, onP); }
        catch {
          if (S.assets && assetType(a.video) && a.video.size <= MAX_ASSET){
            stage("Saving the video so it can be read…");
            try { uploadedVideo = await uploadOne(a.video); frames = await videoFrames(uploadedVideo.url, want, onP); }
            catch { frames = null; }
          }
          if (!frames && !a.captions.trim()) throw { user:"Couldn't read that video here. Try an MP4 file, or paste the captions or transcript instead." };
        } finally { URL.revokeObjectURL(blobUrl); }
        if (frames){ images = frames.blobs; dur = frames.duration; }
      }
      check();
      if (images.length){ say.push(`${images.length} stills taken at even intervals from a ${Math.round(dur)}-second crochet video, in order.`); picsExplained = true; }
    }
    if (a.kind === "text"){
      parts.push(`PATTERN TEXT\n${a.text.trim()}`);
      say.push("Pattern text pasted by the person.");
    }
    if (captions && a.kind !== "text"){
      parts.unshift(`CAPTION, TRANSCRIPT OR DESCRIPTION FROM THE POST OR VIDEO\n${captions}`);
      say.push("The caption, transcript or description from the post or video is below.");
    }
    if (link) say.push(`Link to the original, for the credit only (you can't open it): ${link}`);

    // More pictures than one request can carry (a long carousel or scanned PDF):
    // read them in batches first, then translate the combined transcript.
    if (images.length > perCall){
      const transcript = await transcribe(images, perCall, noun, ctl.signal, check);
      parts.push(`TRANSCRIPT OF ALL ${images.length} ${noun.toUpperCase()}, IN ORDER\n${transcript}`);
      say.push(`There were too many ${noun} to attach at once, so a transcript of all ${images.length} of them is below instead of the pictures.`);
      images = [];
    } else if (images.length && !picsExplained){
      say.push("The pictures are attached, in order.");
    }
    let body = parts.join("\n\n");
    if (body.length > 50000){
      body = body.slice(0, 50000);
      say.push("The source was too long and is cut off at the end: add a pattern note saying the last part wasn't read.");
    }
    ctx.describe = say.join(" ");
    ctx.body = body;

    check();
    stage("Claude is translating — long patterns can take a minute or two.");
    const opts = { signal:ctl.signal, onText:({ text }) => {
      const n = (text.match(/"label"\s*:/g) || []).length;
      stage(n ? `Writing your checklist… ${n} row${n === 1 ? "" : "s"} so far` : "Writing your checklist…");
    }};
    if (images.length) opts.images = images;
    const raw = await S.sample.json(buildPrompt(ctx), opts);
    const pattern = normalize(raw);
    if (!pattern.sections.length) throw { user:"Claude couldn't find any rows or steps in that. Check that it's the pattern itself, or add the captions." };
    if (ctx.title) pattern.title = ctx.title;
    if (ctx.designer){ pattern.credit.designer = ctx.designer; pattern.designer = ctx.designer; }
    if (link) pattern.credit.link = link;

    // keep the original alongside the checklist
    stage("Saving…");
    const files = [], skipped = [];
    const originals = a.kind === "file" ? a.files : a.kind === "video" && a.video ? [a.video] : [];
    for (const f of originals){
      if (uploadedVideo && f === a.video){ files.push(uploadedVideo); continue; }
      if (!S.assets){ skipped.push(f.name); continue; }
      try { files.push(await uploadOne(f)); } catch { skipped.push(f.name); }
    }
    source.files = files.map(({ id, name, type }) => ({ id, name, type }));
    if (skipped.length) source.unsaved = `Not kept: ${skipped.join(", ")} (too large or an unsupported file type).`;
    const now = Date.now();
    const doc = { ...pattern, source, done:{}, createdAt:now, updatedAt:now };
    let id;
    if (S.db){
      const ref = S.db.collection("patterns").doc();
      try { await ref.set(doc); }
      catch (e){ throw { user: dbErrorCopy(e) }; }
      id = ref.id;
    } else {
      id = "local-" + now;
      toast("Saving isn't available here, so this checklist disappears when you close the page.");
    }
    S.pending[id] = { id, ...doc };
    S.job = null; S.add = freshAdd();
    go("pattern", id);
  } catch (e){
    if (e?.code === "cancelled"){ S.job = null; paintJob(); return; }
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") S.sampleState = "off";
    S.job = { error: e?.user || (e?.code ? sampleErrorCopy(e) : "Something went wrong while reading that file. Try again, or use screenshots instead.") };
    paintJob();
  }
}

/* ---------- start ---------- */
render();
(async () => {
  const use = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, sample, assets] = await Promise.all([use("db"), use("sample"), use("assets")]);
  S.sample = sample; S.assets = assets;
  S.sampleState = sample ? "ready" : "off";
  if (sample){ const caps = await sample.limits().catch(() => null); S.imgLimits = caps?.images || null; }
  if (!db){ S.dbState = "off"; render(); return; }
  S.db = db;
  db.collection("patterns").orderBy("updatedAt", "desc").onSnapshot(snap => {
    S.patterns = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    for (const id in S.pending) if (S.patterns.some(p => p.id === id)) delete S.pending[id];
    S.dbState = "ready";
    if (S.view === "library") render();
    else if (S.view === "pattern" && !S.editing && !S.editInfo){
      const p = getPattern(S.openId);
      if (p && structKey(p) === S.renderKey) paintCurrent(p); else render();
    }
  }, () => { S.dbState = "off"; if (S.view === "library") render(); });
  if (S.view === "library") render();
})();
</script>
